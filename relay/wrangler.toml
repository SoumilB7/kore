# The relay. Not deployed: deploying needs the owner's Cloudflare account and go.
name = "kore-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# No logs of what passes through.
[observability]
enabled = false
